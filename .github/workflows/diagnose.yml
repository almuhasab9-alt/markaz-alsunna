name: Diagnose Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Curl basic check
        if: always()
        run: |
          set +e
          echo "=== HTTP status ==="
          CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 30 https://markaz-alsunna.pages.dev)
          echo "HTTP status: $CODE"
          echo "::notice::HTTP status: $CODE"
          echo "=== Response headers ==="
          curl -sI --max-time 30 https://markaz-alsunna.pages.dev 2>&1 | head -30
          echo "=== Body (first 1000 chars) ==="
          head -c 1000 /tmp/body.html
          echo ""
          echo "=== Body size ==="
          wc -c /tmp/body.html
          exit 0

      - name: Check DNS and redirects
        if: always()
        run: |
          set +e
          echo "=== DNS resolution ==="
          dig markaz-alsunna.pages.dev +short 2>/dev/null || nslookup markaz-alsunna.pages.dev 2>&1
          echo "=== HTTPS follow redirects ==="
          curl -sIL --max-time 30 https://markaz-alsunna.pages.dev 2>&1 | head -40
          exit 0

      - name: Check API routes
        if: always()
        run: |
          set +e
          echo "=== /api/health ==="
          curl -s -w "\nHTTP=%{http_code}\n" --max-time 15 https://markaz-alsunna.pages.dev/api/health 2>&1 | head -10
          echo "=== /api/login ==="
          curl -s -w "\nHTTP=%{http_code}\n" --max-time 15 https://markaz-alsunna.pages.dev/api/login 2>&1 | head -10
          echo "=== / (root) ==="
          curl -s -w "\nHTTP=%{http_code}\n" --max-time 15 https://markaz-alsunna.pages.dev/ 2>&1 | head -10
          exit 0

      - name: List Cloudflare Pages projects
        if: always()
        run: |
          set +e
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "=== Pages projects ==="
          npx wrangler pages project list 2>&1 | head -20
          echo "=== D1 databases ==="
          npx wrangler d1 list 2>&1 | head -20
          echo "=== D1 tables ==="
          npx wrangler d1 execute webapp-production --remote --command "SELECT name FROM sqlite_master WHERE type='table'" 2>&1 | head -30
          echo "=== Pages deployments ==="
          npx wrangler pages deployment list --project-name=markaz-alsunna 2>&1 | head -20
          exit 0

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis
          path: |
            /tmp/body.html
