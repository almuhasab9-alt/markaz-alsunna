name: Diagnose Deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Configure Cloudflare credentials
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Run diagnosis
        run: |
          set +e
          {
            echo "# Deployment Diagnosis Report v2"
            echo "Date: $(date -u)"
            echo ""
            echo "## HTTP Status Check"
            CODE=$(curl -s -o /tmp/body.html -w "%{http_code}" --max-time 30 https://markaz-alsunna.pages.dev)
            echo "HTTP status: $CODE"
            echo ""
            echo "## DNS Resolution"
            dig markaz-alsunna.pages.dev +short 2>/dev/null || nslookup markaz-alsunna.pages.dev 2>&1
            echo ""
            echo "## Cloudflare Pages Projects"
            npx wrangler pages project list 2>&1
            echo ""
            echo "## Pages Deployments for markaz-alsunna"
            npx wrangler pages deployment list --project-name=markaz-alsunna 2>&1
            echo ""
            echo "## D1 Databases"
            npx wrangler d1 list 2>&1
            echo ""
            echo "## D1 Tables"
            npx wrangler d1 execute webapp-production --remote --command "SELECT name FROM sqlite_master WHERE type='table'" 2>&1
            echo ""
            echo "## Attempt dry-run deploy"
            npx wrangler pages deploy --dry-run 2>&1
            echo ""
            echo "## Attempt real deploy with verbose"
            npx wrangler pages deploy --verbose 2>&1
            echo ""
          } > diagnosis-report.md 2>&1
          cat diagnosis-report.md
          exit 0

      - name: Commit diagnosis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnosis-report.md
          git commit -m "chore: update diagnosis report v2" || echo "no changes"
          git push || echo "nothing to push"

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis
          path: diagnosis-report.md
